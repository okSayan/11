<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0A0D14;
    --card-a:    #101520;
    --card-b:    #0E1219;
    --gold:      #C9A84C;
    --gold-dim:  rgba(201,168,76,0.12);
    --gold-glow: rgba(201,168,76,0.22);
    --white:     #E8EAF0;
    --muted:     #8B92A8;
    --divider:   rgba(139,146,168,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }

  /* ── subtle noise texture ── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 200px 200px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── top header bar ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--divider);
    z-index: 10;
  }
  header span {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
  }
  header .dot {
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--gold);
    margin: 0 14px;
    vertical-align: middle;
    animation: pulse 3s ease-in-out infinite;
  }

  /* ── main layout ── */
  main {
    position: relative;
    z-index: 1;
    height: 100vh;
    padding-top: 56px;
    display: flex;
  }

  /* ── each portal card ── */
  .portal {
    flex: 1;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    text-decoration: none;
    overflow: hidden;
    cursor: pointer;
    transition: background 0.5s ease;
  }

  .portal:first-child {
    background: var(--card-a);
    border-right: 1px solid var(--divider);
  }
  .portal:last-child {
    background: var(--card-b);
  }

  /* ambient glyph watermark */
  .portal::before {
    content: attr(data-glyph);
    position: absolute;
    font-size: clamp(240px, 30vw, 420px);
    line-height: 1;
    color: rgba(201,168,76,0.04);
    pointer-events: none;
    transition: transform 0.6s ease, color 0.5s ease;
    user-select: none;
    letter-spacing: -0.05em;
  }

  /* radial bloom on hover */
  .portal::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, var(--gold-glow), transparent 70%);
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
  }

  .portal:hover::after { opacity: 1; }
  .portal:hover::before {
    transform: scale(1.06);
    color: rgba(201,168,76,0.09);
  }
  .portal:hover { background: #131826; }
  .portal:last-child:hover { background: #111520; }

  /* card content */
  .portal-inner {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 48px;
    text-align: center;
    transition: transform 0.4s ease;
  }

  .portal:hover .portal-inner {
    transform: translateY(-6px);
  }

  .eyebrow {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.8;
  }

  .label {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 7vw, 96px);
    font-weight: 300;
    line-height: 0.95;
    color: var(--white);
    letter-spacing: -0.02em;
    transition: color 0.3s;
  }
  .label em {
    font-style: italic;
    color: var(--gold);
  }

  .portal:hover .label { color: #fff; }

  .desc {
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    color: var(--muted);
    max-width: 260px;
    line-height: 1.8;
    font-weight: 300;
  }

  /* arrow button */
  .arrow-btn {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--divider);
    border-radius: 2px;
    padding: 10px 22px;
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    transition: border-color 0.3s, color 0.3s, background 0.3s;
  }
  .portal:hover .arrow-btn {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--gold-dim);
  }
  .arrow-btn svg {
    width: 14px; height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: transform 0.3s;
  }
  .portal:hover .arrow-btn svg {
    transform: translate(3px, -3px);
  }

  /* vertical divider label */
  .center-mark {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .center-mark .line {
    width: 1px;
    height: 40px;
    background: var(--divider);
  }
  .center-mark .oc {
    width: 8px; height: 8px;
    border: 1px solid var(--divider);
    border-radius: 50%;
  }

  /* ── animations ── */
  @keyframes pulse {
    0%, 100% { opacity: 0.5; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .portal:first-child .portal-inner { animation: fadeUp 0.7s ease 0.1s both; }
  .portal:last-child  .portal-inner { animation: fadeUp 0.7s ease 0.25s both; }

  /* ── responsive ── */
  @media (max-width: 640px) {
    html, body { overflow: auto; }
    main { flex-direction: column; height: auto; }
    .portal { min-height: calc(50vh - 28px); }
    .portal:first-child { border-right: none; border-bottom: 1px solid var(--divider); }
    .center-mark { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .portal, .portal::before, .portal::after,
    .portal-inner, .arrow-btn svg { transition: none; animation: none; }
  }
</style>
</head>
<body>

<header>
  <span>Presentation</span>
  <span class="dot"></span>
  <span>Project</span>
</header>

<div class="center-mark">
  <div class="line"></div>
  <div class="oc"></div>
  <div class="line"></div>
</div>

<main>

  <!-- ── PRESENTATION ── -->
  <a class="portal" href="https://docs.google.com/presentation/d/1Jd2tDBfxAabyQL_a9jkxpZup75H51NiduwG8SVbbqrs/edit?usp=drivesdk" data-glyph="◈" aria-label="Open Presentation">
    <div class="portal-inner">
      <span class="eyebrow">View</span>
      <h2 class="label">Pre<em>sen</em><br>tation</h2>
      <p class="desc">Slides, narrative, and vision — the full story in one place.</p>
      <div class="arrow-btn">
        Open Slides
        <svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </div>
    </div>
  </a>

  <!-- ── PROJECT ── -->
  <a class="portal" href="https://bencalendar.netlify.app/" data-glyph="⊞" aria-label="Open Project">
    <div class="portal-inner">
      <span class="eyebrow">Explore</span>
      <h2 class="label">The<br><em>Pro</em>ject</h2>
      <p class="desc">Live build, source, and everything it took to get here.</p>
      <div class="arrow-btn">
        Open Project
        <svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
      </div>
    </div>
  </a>

</main>

</body>
  </html>
